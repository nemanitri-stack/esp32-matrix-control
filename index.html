<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 LED Matrix Control</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      background-color: #121212;
      color: #ffffff;
      border-radius: 10px;
    }
    h2 {
      text-align: center;
      color: #00e676;
    }
    .status {
      text-align: center;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 5px;
      background-color: #333;
      font-weight: bold;
    }
    .status.connected {
      background-color: #1b5e20;
      color: #a5d6a7;
    }
    button {
      background-color: #00e676;
      color: #000;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 15px;
    }
    button:hover {
      background-color: #00c853;
    }
    input[type="text"] {
      width: calc(100% - 22px);
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #444;
      background-color: #222;
      color: #fff;
      margin-bottom: 15px;
    }
    .card {
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <h2>ESP32 LED Matrix Controller</h2>
  
  <div id="status" class="status">Status: Disconnected</div>
  
  <button id="connectBtn" onclick="connectBLE()">Connect to ESP32 Matrix</button>

  <div class="card">
    <h3>Send Text Message</h3>
    <input type="text" id="textInput" placeholder="Enter text (max 5 chars fit)..." maxlength="10">
    <button onclick="sendText()">Send Text to Matrix</button>
  </div>

  <script>
    const SERVICE_UUID = "4fa8691a-0351-411b-1d85-4d38d0812345";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bleCharacteristic = null;

    async function connectBLE() {
      const statusDiv = document.getElementById("status");
      try {
        statusDiv.innerText = "Status: Searching for ESP32...";
        
        // Connect via Service UUID with optionalServices fallback
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [SERVICE_UUID] }],
          optionalServices: [SERVICE_UUID]
        });

        statusDiv.innerText = "Status: Connecting to GATT Server...";
        const server = await device.gatt.connect();

        statusDiv.innerText = "Status: Locating Matrix Service...";
        const service = await server.getPrimaryService(SERVICE_UUID);

        statusDiv.innerText = "Status: Acquiring Characteristic...";
        bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        statusDiv.innerText = "Status: Connected to ESP32 Matrix!";
        statusDiv.classList.add("connected");
        
        // Monitor unexpected disconnects
        device.addEventListener('gattserverdisconnected', onDisconnected);

      } catch (error) {
        console.error("Web Bluetooth Error:", error);
        statusDiv.innerText = "Connection Failed: " + error.message;
        statusDiv.classList.remove("connected");
      }
    }

    function onDisconnected() {
      const statusDiv = document.getElementById("status");
      statusDiv.innerText = "Status: Disconnected. Please Reconnect.";
      statusDiv.classList.remove("connected");
      bleCharacteristic = null;
    }

    async function sendText() {
      if (!bleCharacteristic) {
        alert("Please connect to the ESP32 first!");
        return;
      }

      const textVal = document.getElementById("textInput").value;
      if (!textVal) {
        alert("Please enter a text message!");
        return;
      }

      // Format payload with TXT: prefix for the ESP32 parser
      const payload = "TXT:" + textVal;
      const encoder = new TextEncoder();
      const data = encoder.encode(payload);

      try {
        await bleCharacteristic.writeValue(data);
        console.log("Sent payload:", payload);
      } catch (error) {
        console.error("Failed to send text:", error);
        alert("Failed to send text to ESP32.");
      }
    }
  </script>
</body>
</html>
